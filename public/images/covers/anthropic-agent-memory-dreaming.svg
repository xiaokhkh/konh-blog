    <path d="M622 640 H895" stroke="#31525b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="965" cy="274" r="22" fill="url(#memory)"/>
    <circle cx="965" cy="400" r="22" fill="#9bbcff"/>
    <circle cx="965" cy="526" r="22" fill="#ff8a7a"/>
    <path d="M762 140 C792 108 838 108 866 140" fill="none" stroke="#5eead4" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1238" y="230" width="240" height="160" rx="34" fill="#182b35" stroke="#49616b" stroke-width="2"/>
    <rect x="1238" y="510" width="240" height="160" rx="34" fill="#182b35" stroke="#49616b" stroke-width="2"/>
