<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent memory and dreaming system diagram</title>
  <desc id="desc">A stylized production memory architecture with agent sessions, shared memory stores, audit trails, and an asynchronous dreaming process.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101923"/>
      <stop offset="0.45" stop-color="#17222d"/>
      <stop offset="1" stop-color="#0b1218"/>
    </linearGradient>
    <linearGradient id="memory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#f6c85f"/>
    </linearGradient>
    <linearGradient id="dream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9bbcff"/>
      <stop offset="1" stop-color="#ff8a7a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 710 C260 630 360 765 575 690 C795 612 910 640 1100 705 C1280 765 1425 685 1600 610 L1600 900 L0 900 Z" fill="#0f2730" opacity="0.85"/>
  <path d="M0 138 C165 70 320 116 492 112 C730 105 808 40 1030 84 C1268 132 1375 62 1600 104" fill="none" stroke="#2b4450" stroke-width="2" opacity="0.8"/>

  <g opacity="0.55">
    <path d="M293 284 H542" stroke="#6c8592" stroke-width="3" stroke-dasharray="10 14"/>
    <path d="M293 456 H542" stroke="#6c8592" stroke-width="3" stroke-dasharray="10 14"/>
    <path d="M293 628 H542" stroke="#6c8592" stroke-width="3" stroke-dasharray="10 14"/>
    <path d="M1040 310 H1288" stroke="#6c8592" stroke-width="3" stroke-dasharray="10 14"/>
    <path d="M1040 590 H1288" stroke="#6c8592" stroke-width="3" stroke-dasharray="10 14"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="130" y="210" width="220" height="138" rx="26" fill="#182b35" stroke="#37515d" stroke-width="2"/>
    <rect x="130" y="382" width="220" height="138" rx="26" fill="#182b35" stroke="#37515d" stroke-width="2"/>
    <rect x="130" y="554" width="220" height="138" rx="26" fill="#182b35" stroke="#37515d" stroke-width="2"/>
    <circle cx="205" cy="279" r="26" fill="#5eead4"/>
    <circle cx="205" cy="451" r="26" fill="#9bbcff"/>
    <circle cx="205" cy="623" r="26" fill="#ff8a7a"/>
    <path d="M250 264 H310 M250 286 H294" stroke="#d6e5e9" stroke-width="10" stroke-linecap="round"/>
    <path d="M250 436 H310 M250 458 H294" stroke="#d6e5e9" stroke-width="10" stroke-linecap="round"/>
    <path d="M250 608 H310 M250 630 H294" stroke="#d6e5e9" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="520" y="162" width="560" height="576" rx="42" fill="#f8faf5"/>
    <rect x="580" y="232" width="440" height="84" rx="18" fill="#16313b"/>
    <rect x="580" y="358" width="440" height="84" rx="18" fill="#173542"/>
    <rect x="580" y="484" width="440" height="84" rx="18" fill="#173542"/>
