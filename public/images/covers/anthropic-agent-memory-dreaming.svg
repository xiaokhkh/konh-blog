  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1080 274 C1160 262 1192 285 1238 310" stroke="#5eead4" stroke-width="6"/>
    <path d="M1238 590 C1188 620 1134 626 1080 640" stroke="#f6c85f" stroke-width="6"/>
    <path d="M1080 526 C1162 508 1194 520 1238 560" stroke="#9bbcff" stroke-width="6" stroke-dasharray="14 16"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="116" y="112" fill="#f8faf5" font-size="56" font-weight="740">Agent Memory</text>
    <text x="116" y="166" fill="#9db0b8" font-size="30">shared state, audit trail, async dreaming</text>
    <text x="610" y="205" fill="#31525b" font-size="26" font-weight="700">memory store</text>
    <text x="1278" y="720" fill="#9db0b8" font-size="24">dream job</text>
  </g>
</svg>
