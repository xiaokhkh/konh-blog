chor="middle" class="sub">只读、构造复现</text><rect x="390.0" y="416.0" width="320" height="88" rx="13" fill="#fff0d7" stroke="#262521" stroke-width="2.2"/><text x="550" y="453" text-anchor="middle" class="label">主 agent 判断原因</text><text x="550" y="483" text-anchor="middle" class="sub">汇总并处理冲突</text><rect x="415.0" y="551.0" width="270" height="88" rx="13" fill="#ffffff" stroke="#262521" stroke-width="2.2"/><text x="550" y="588" text-anchor="middle" class="label">实现补丁</text><text x="550" y="618" text-anchor="middle" class="sub">明确写入责任</text><rect x="415.0" y="676.0" width="270" height="88" rx="13" fill="#ffffff" stroke="#262521" stroke-width="2.2"/><text x="550" y="713" text-anchor="middle" class="label">验证指定版本</text><text x="550" y="743" text-anchor="middle" class="sub">检查验收条件</text><rect x="125.0" y="796.0" width="310" height="88" rx="13" fill="#ffffff" stroke="#262521" stroke-width="2.2"/><text x="280" y="848" text-anchor="middle" class="label">交付代码与证据</text></svg>