<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="910" viewBox="0 0 1100 910" role="img" aria-labelledby="title desc">
<title id="title">从调查到验收：一次有证据的协作</title><desc id="desc">目标分发给请求链路与并发调查，两者向主 agent 返回发现。主 agent 决定实现补丁，再验证指定版本。验收失败回到修复，成功交付代码与证据。</desc>
