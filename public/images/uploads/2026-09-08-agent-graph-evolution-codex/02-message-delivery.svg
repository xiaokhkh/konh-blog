<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
<title id="title">一条 agent 消息的投递路径</title><desc id="desc">调用经处理器、注册表和 AgentControl 进入目标邮箱。邮箱一方面通知活动，另一方面在允许的边界转为模型输入。通知不等于执行完成。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#262521" stroke-width="1.5"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ba591e" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#fffefa"/>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#262521}.label{font-size:23px}.sub{font-size:19px;fill:#68645b}.title{font-size:30px;font-weight:600}</style>
<text x="44" y="56" class="title">一条 agent 消息的投递路径</text><path d="M330 150 L420 150" fill="none" stroke="#262521" stroke-width="2.6"  marker-end="url(#arrow)"/><path d="M680 150 L790 150" fill="none" stroke="#262521" stroke-width="2.6"  marker-end="url(#arrow)"/><path d="M920 194 L920 306" fill="none" stroke="#262521" stroke-width="2.6"  marker-end="url(#arrow)"/><path d="M790 350 L680 350" fill="none" stroke="#262521" stroke-width="2.6"  marker-end="url(#arrow)"/><path d="M420 350 L310 350" fill="none" stroke="#ba591e" stroke-width="2.6" stroke-dasharray="8 8" marker-end="url(#orange)"/><path d="M550 394 L550 516" fill="none" stroke="#262521" stroke-width="2.6"  marker-end="url(#arrow)"/><path d="M420 560 L310 560" fill="none" stroke="#262521" stroke-width="2.6"  marker-end="url(#arrow)"/><rect x="30.0" y="106.0" width="300" height="88" rx="13" fill="#ffffff" stroke="#262521" stroke-width="2.2"/><text x="180" y="143" text-anchor="middle" class="label">agent 工具调用</text><text x="180" y="173" text-anchor="middle" class="sub">send_message / followup_task</text><rect x="420.0" y="106.0" width="260" height="88" rx="13" fill="#ffffff" stroke="#262521" stroke-width="2.2"/><text x="550" y="143" text-anchor="middle" class="label">消息处理器</text><text x="550" y="173" text-anchor="middle" class="sub">目标与投递模式</text><rect x="790.0" y="106.0" width="260" height="88" rx="13" fill="#ffffff" stroke="#262521" stroke-width="2.2"/><text x="920" y="143" text-anchor="middle" class="label">注册表</text><text x="920" y="173" text-anchor="middle" class="sub">路径 → 线程 ID</text><rect x="790.0" y="306.0" width="260" height="88" rx="13" fill="#ffffff" stroke="#262521" stroke-width="2.2"/><text x="920" y="343" text-anchor="middle" class="label">AgentControl</text><text x="920" y="373" text-anchor="middle" class="sub">提交通信操作</text><rect x="420.0" y="306.0" width="260" height="88" rx="13" fill="#fff0d7" stroke="#262521" stroke-width="2.2"/><text x="550" y="343" text-anchor="middle" class="label">目标 InputQueue</text><text x="550" y="373" text-anchor="middle" class="sub">保存待处理消息</text><rect x="50.0" y="306.0" width="260" height="88" rx="13" fill="#ffffff" stroke="#262521" stroke-width="2.2"/><text x="180" y="343" text-anchor="middle" class="label">活动通知</text><text x="180" y="373" text-anchor="middle" class="sub">唤醒等待者</text><rect x="420.0" y="516.0" width="260" height="88" rx="13" fill="#ffffff" stroke="#262521" stroke-width="2.2"/><text x="550" y="553" text-anchor="middle" class="label">允许的投递边界</text><text x="550" y="583" text-anchor="middle" class="sub">转换为模型输入</text><rect x="50.0" y="516.0" width="260" height="88" rx="13" fill="#ffffff" stroke="#262521" stroke-width="2.2"/><text x="180" y="553" text-anchor="middle" class="label">目标 agent</text><text x="180" y="583" text-anchor="middle" class="sub">继续判断与执行</text><text x="550" y="664" text-anchor="middle" class="sub">消息入队 ≠ 已进入上下文 ≠ 工作已完成</text></svg>