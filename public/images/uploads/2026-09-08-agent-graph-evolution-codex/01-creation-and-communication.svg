<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
<title id="title">创建关系是树，消息可以跨分支</title><desc id="desc">主 agent 创建实现者 A 和审查者 B，A 创建定位者 C。B 与 A 交流，C 向 B 发送发现。实线表示创建，橙色虚线表示消息。</desc>
