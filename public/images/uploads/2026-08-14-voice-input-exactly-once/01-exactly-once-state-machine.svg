<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VoiceOps 单次投递状态机</title>
  <desc id="desc">一个按住周期创建一个 Session，从 Starting 经过 Listening、Processing 到 Inserting，并在投递前检查 Session、目标 PID 和唯一投递权。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39e58c"/>
      <stop offset="1" stop-color="#9cff6a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .text { font-family: Poppins, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e8edf5; }
      .muted { fill: #9aa8ba; }
      .state { fill: #151d2a; stroke: #334155; stroke-width: 2; }
      .line { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1480" cy="80" r="180" fill="#19d879" opacity=".05"/>
  <circle cx="80" cy="860" r="240" fill="#2dc8ff" opacity=".04"/>

  <text class="text" x="100" y="105" font-size="48" font-weight="700">一次按住，一个 Session，一次投递</text>
  <text class="text muted" x="100" y="153" font-size="24">状态先收敛，副作用才发生</text>

  <g transform="translate(85 235)">
    <rect class="state" x="0" y="0" width="230" height="130" rx="28"/>
    <text class="text" x="115" y="58" font-size="28" font-weight="700" text-anchor="middle">IDLE</text>
    <text class="text muted" x="115" y="94" font-size="18" text-anchor="middle">等待物理按下</text>

    <path class="line" d="M 230 65 H 286"/>
    <rect class="state" x="300" y="0" width="230" height="130" rx="28"/>
    <text class="text" x="415" y="58" font-size="28" font-weight="700" text-anchor="middle">STARTING</text>
    <text class="text muted" x="415" y="94" font-size="18" text-anchor="middle">权限与音频启动</text>

    <path class="line" d="M 530 65 H 586"/>
    <rect class="state" x="600" y="0" width="230" height="130" rx="28"/>
    <text class="text" x="715" y="58" font-size="28" font-weight="700" text-anchor="middle">LISTENING</text>
    <text class="text muted" x="715" y="94" font-size="18" text-anchor="middle">Fast ASR 只预览</text>

    <path class="line" d="M 830 65 H 886"/>
    <rect class="state" x="900" y="0" width="230" height="130" rx="28"/>
    <text class="text" x="1015" y="58" font-size="28" font-weight="700" text-anchor="middle">PROCESSING</text>
    <text class="text muted" x="1015" y="94" font-size="18" text-anchor="middle">最终 ASR / LLM</text>

    <path class="line" d="M 1130 65 H 1186"/>
    <rect x="1200" y="0" width="230" height="130" rx="28" fill="#12261e" stroke="#39e58c" stroke-width="2"/>
    <text class="text" x="1315" y="58" font-size="28" font-weight="700" text-anchor="middle">INSERTING</text>
    <text x="1315" y="94" font-family="Poppins, PingFang SC, sans-serif" fill="#67f0a7" font-size="18" text-anchor="middle">已领取唯一投递权</text>
  </g>

  <g transform="translate(385 410)">
    <path d="M 115 0 V 70" stroke="#f6c85f" stroke-width="3" stroke-dasharray="8 8"/>
    <rect x="0" y="70" width="370" height="70" rx="22" fill="#2b2415" stroke="#f6c85f" stroke-width="2"/>
    <text class="text" x="185" y="114" font-size="21" text-anchor="middle">key-up 提前到达 → pendingStop</text>
  </g>

  <g transform="translate(110 610)">
    <rect x="0" y="0" width="930" height="190" rx="30" fill="#101723" stroke="#2f3c50" stroke-width="2"/>
    <text class="text" x="42" y="52" font-size="25" font-weight="700">投递前的三道 guard</text>
    <g transform="translate(42 86)">
      <circle cx="14" cy="14" r="14" fill="#2dc8ff"/>
      <text class="text" x="42" y="22" font-size="20">Session UUID 仍然有效</text>
      <circle cx="318" cy="14" r="14" fill="#2dc8ff"/>
      <text class="text" x="346" y="22" font-size="20">目标 PID 仍在前台</text>
      <circle cx="604" cy="14" r="14" fill="#2dc8ff"/>
      <text class="text" x="632" y="22" font-size="20">尚未领取投递权</text>
    </g>
    <text class="text muted" x="42" y="158" font-size="19">任一条件失败：保留识别文本到剪贴板，不恢复焦点，不进行第二种写入。</text>

    <path d="M 930 95 H 1000" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1015" y="0" width="365" height="86" rx="26" fill="#102a20" stroke="#39e58c" stroke-width="2" filter="url(#glow)"/>
    <text class="text" x="1197" y="38" font-size="24" font-weight="700" text-anchor="middle">private Cmd+V</text>
    <text x="1197" y="67" font-family="Poppins, PingFang SC, sans-serif" fill="#67f0a7" font-size="18" text-anchor="middle">仅 V down / up，各一次</text>

    <rect x="1015" y="112" width="365" height="78" rx="26" fill="#2a2114" stroke="#f6c85f" stroke-width="2"/>
    <text class="text" x="1197" y="160" font-size="22" font-weight="600" text-anchor="middle">Copy only · 不重试</text>
  </g>
</svg>
